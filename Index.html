            Loading: () => <svg className="animate-spin -ml-1 mr-2 h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        };

        // --- DIRECT SERVER DOWNLOAD FUNCTION ---
        function forceDownload(url, title, setIsDownloading) {
            if (setIsDownloading) setIsDownloading(true);
            
            setTimeout(() => {
                try {
                    const hasParams = url.includes('?');
                    const downloadUrl = `${url}${hasParams ? '&' : '?'}download=`;
                    
                    const link = document.createElement('a');
                    link.href = downloadUrl;
                    
                    const extension = url.split('.').pop().split(/[?#]/)[0] || 'png';
                    const filename = `${title.replace(/[^a-z0-9]/gi, '_').toLowerCase()}.${extension}`;
                    link.setAttribute('download', filename);
                    // Force download in same context but browsers handle file downloads without navigation
                    link.target = "_self"; 
                    
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                } catch (error) {
                    console.error("Download error:", error);
                    alert("Download failed.");
                } finally {
                    if (setIsDownloading) setIsDownloading(false);
                }
            }, 100); 
        }

        // --- INTERNAL APP AD PAGE (SANDBOXED IFRAME - INSIDE APP) ---

            const iframeRef = useRef(null);

            useEffect(() => {

                    const timer = setTimeout(() => setTimeLeft(prev => prev - 1), 1000);
                    return () => clearTimeout(timer);
                } else {
                    setCanSkip(true);
                }
            }, [timeLeft]);

            // Default fallback if DB is empty
            const adUrl = adSettings?.linkUrl || 'https://omg10.com/4/10006720';

            return (
                <div className="fixed inset-0 z-[100] bg-black flex flex-col h-screen w-screen overflow-hidden">
                    
                    {/* Header Bar */}

                            Sponsored Content
                        </div>
                        <div className="flex items-center gap-3">
                             {!canSkip ? (
                                <div className="bg-gray-800 text-gray-300 px-4 py-2 rounded-full text-xs font-mono">
                                    Wait {timeLeft}s
                                </div>
                             ) : (
                                <button 
                                    onClick={onFinish}
                                    className="bg-green-600 hover:bg-green-500 text-white text-xs px-6 py-2 rounded-full font-bold animate-bounce shadow-lg shadow-green-900/50 flex items-center gap-2"
                                >
                                    SKIP & DOWNLOAD <Icons.Download />
                                </button>
                             )}

                    </div>

                    {/* The "Inside App" Ad Container */}
                    <div className="flex-1 relative w-full h-full bg-white">
                        {/* Loading Spinner underneath iframe */}
                        <div className="absolute inset-0 flex flex-col items-center justify-center text-gray-500 z-0 bg-gray-50">

                            <p className="mt-4 text-sm font-medium text-gray-600">Loading Advertisement...</p>
                            <p className="mt-2 text-xs text-gray-400 max-w-xs text-center">
                                If the screen remains white, please wait for the timer to finish and click Skip.
                            </p>
                        </div>

                        {/* 
                            SANDBOX IFRAME 
                            This keeps the Direct Link "Inside" the app.
                            Note: Some networks block iframes. If white screen appears, user waits for Skip.
                        */}
                        <iframe

        // --- COMPONENTS ---

        function AssetModal({ asset, onClose, onEdit, adSettings }) {
            if (!asset) return null;
            const isAnimation = asset.type === 'Animation';
            const [isDownloading, setIsDownloading] = useState(false);
            const [showAdPage, setShowAdPage] = useState(false);

            const initiateDownload = () => {
                // Show the internal Ad Page inside the app
                setShowAdPage(true);
            };

            const handleAdFinished = () => {
                // Close Ad Page
                setShowAdPage(false);
                // Update stats
                supabaseClient.from('assets').update({ downloads: (asset.downloads || 0) + 1 }).eq('id', asset.id).then();
                // Start Download
                forceDownload(asset.url, asset.title, setIsDownloading);
            };

            return (
                <>
                    {/* Render AdPage ON TOP of everything (App ke andar) */}
                    {showAdPage && <InternalAdPage onFinish={handleAdFinished} adSettings={adSettings} />}

                            <div className="flex-1 bg-black relative flex items-center justify-center p-0 md:p-6 overflow-hidden">
                                 {isAnimation ? (
                                    <video 
                                        src={asset.url} 
                                        className="max-w-full max-h-full object-contain shadow-xl" 
                                        controls 
                                        autoPlay 
                                        loop 
                                        playsInline
                                        crossOrigin="anonymous" 
                                    />
                                 ) : (
                                    <img src={asset.url} className="max-w-full max-h-full object-contain shadow-xl" crossOrigin="anonymous" />
                                 )}
                                 <button onClick={onClose} className="absolute top-4 left-4 bg-black/50 p-2 rounded-full hover:bg-black/80 text-white md:hidden"><Icons.Close /></button>

                                        disabled={isDownloading}

                                    >
                                        {isDownloading ? <Icons.Loading /> : <Icons.Download />}

                                        <button onClick={() => onEdit(asset)} className="w-full bg-transparent border border-gray-600 hover:bg-gray-700 text-white py-3 rounded-lg font-semibold flex items-center justify-center gap-2">

        // --- PRO EDITOR ---
        function ProEditor({ asset, onClose, allAssets }) {
            const [canvas, setCanvas] = useState(null);
            const [activeTool, setActiveTool] = useState('elements'); 
            const [selectedObject, setSelectedObject] = useState(null);
            const [drawerWidth, setDrawerWidth] = useState(250); 
            const isResizing = useRef(false);

            useEffect(() => {
                const initCanvas = new fabric.Canvas('editor-canvas', {
                    width: 800,
                    height: 600,
                    backgroundColor: '#ffffff',
                    preserveObjectStacking: true,
                });

                if (asset) {
                    fabric.Image.fromURL(asset.url, (img) => {
                        const scale = Math.min(600 / img.width, 500 / img.height);
                        img.set({ scaleX: scale, scaleY: scale });
                        initCanvas.centerObject(img);
                        initCanvas.add(img);
                        initCanvas.setActiveObject(img);
                    }, { crossOrigin: 'anonymous' }); 
                }

                const updateSelection = () => setSelectedObject(initCanvas.getActiveObject());
                initCanvas.on('selection:created', updateSelection);
                initCanvas.on('selection:updated', updateSelection);
                initCanvas.on('selection:cleared', () => setSelectedObject(null));
                setCanvas(initCanvas);
                
                return () => initCanvas.dispose();
            }, [asset]);

            useEffect(() => {
                const handleMove = (clientX) => {
                    if (!isResizing.current) return;
                    let newWidth = clientX - 64; 
                    if (newWidth < 100) newWidth = 0; 
                    if (newWidth > 100 && newWidth < 150) newWidth = 150;
                    if (newWidth > 500) newWidth = 500;
                    setDrawerWidth(newWidth);
                };
                const onMouseMove = (e) => handleMove(e.clientX);
                const onTouchMove = (e) => handleMove(e.touches[0].clientX);
                const stopResize = () => { isResizing.current = false; };
                window.addEventListener('mousemove', onMouseMove);
                window.addEventListener('mouseup', stopResize);
                window.addEventListener('touchmove', onTouchMove);
                window.addEventListener('touchend', stopResize);
                return () => {
                    window.removeEventListener('mousemove', onMouseMove);
                    window.removeEventListener('mouseup', stopResize);
                    window.removeEventListener('touchmove', onTouchMove);
                    window.removeEventListener('touchend', stopResize);
                };
            }, []);

            const startResizing = () => { isResizing.current = true; };

            const addText = (type) => {
                if(!canvas) return;
                const options = { left: 100, top: 100, fill: '#000000', fontFamily: 'Inter' };
                if (type === 'heading') { options.fontSize = 48; options.fontWeight = 'bold'; options.text = 'Heading'; }
                else if (type === 'sub') { options.fontSize = 32; options.fontWeight = '600'; options.text = 'Subheading'; }
                else { options.fontSize = 18; options.text = 'Body text'; }
                const text = new fabric.Textbox(options.text, options);
                canvas.add(text);
                canvas.setActiveObject(text);
            };

            const addShape = (shape) => {
                const common = { left: 150, top: 150, fill: '#3b82f6' };
                let obj = shape === 'rect' ? new fabric.Rect({ ...common, width: 100, height: 100 }) : new fabric.Circle({ ...common, radius: 50 });
                canvas.add(obj); canvas.setActiveObject(obj);
            };

            const addImage = (url) => {
                fabric.Image.fromURL(url, (img) => {
                    img.scaleToWidth(200);
                    canvas.add(img);
                    canvas.centerObject(img);
                    canvas.setActiveObject(img);
                }, { crossOrigin: 'anonymous' });
            };

            const download = () => {
                const dataURL = canvas.toDataURL({ format: 'png', quality: 1, multiplier: 2 });
                const link = document.createElement('a');
                link.download = 'design-pro.png';
                link.href = dataURL;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };
            
            const changeColor = (e) => {
                if(!selectedObject) return;
                selectedObject.set('fill', e.target.value);
                canvas.requestRenderAll();
            };

            const elementsAssets = allAssets.filter(a => ['Elements', 'Sticker', 'Emoji', 'Icon'].includes(a.type));
            const overlayAssets = allAssets.filter(a => ['Overlay', 'Background'].includes(a.type));
            let animationAssets = allAssets.filter(a => a.type === 'Animation');

            const ToolBtn = ({ icon: Icon, label, id }) => (
                <button onClick={() => { setActiveTool(id); if(drawerWidth === 0) setDrawerWidth(250); }} className={`w-full flex flex-col items-center justify-center py-4 gap-1 transition-colors ${activeTool === id ? 'bg-editor-panel text-accent border-l-2 border-accent' : 'text-gray-400 hover:text-white'}`}>
                    <Icon />
                    <span className="text-[10px] font-medium tracking-wide">{label}</span>
                </button>
            );

            return (
                <div className="fixed inset-0 z-50 flex flex-col bg-editor-bg text-gray-200">
                    <header className="h-14 bg-editor-panel border-b border-editor-border flex items-center justify-between px-4 shrink-0">
                        <div className="flex items-center gap-4">
                            <button onClick={onClose} className="p-2 hover:bg-white/10 rounded-md transition text-gray-400 hover:text-white"><Icons.Close /></button>
                            <h1 className="text-sm font-bold text-white hidden md:block">Pro Editor <span className="text-gray-500 font-normal">| {asset.title}</span></h1>
                        </div>
                        <div className="flex-1 flex justify-center items-center gap-4">
                            {selectedObject ? (
                                <>
                                    <input type="color" className="w-8 h-8 rounded cursor-pointer bg-transparent" onChange={changeColor} />
                                    <button onClick={() => {selectedObject.bringForward(); canvas.requestRenderAll()}} className="p-2 hover:bg-white/10"><Icons.Layers /></button>
                                    <button onClick={() => {canvas.remove(selectedObject); setSelectedObject(null)}} className="p-2 hover:bg-red-500/20 text-red-400"><Icons.Trash /></button>
                                </>
                            ) : <span className="text-xs text-gray-500">Select Object</span>}
                        </div>
                        <button onClick={download} className="bg-accent hover:bg-accent-hover text-white text-xs font-bold px-4 py-2 rounded-md">Export PNG</button>
                    </header>

                    <div className="flex-1 flex overflow-hidden relative">
                        <div className="w-16 bg-editor-panel border-r border-editor-border flex flex-col z-20 shrink-0 h-full">
                            <ToolBtn icon={Icons.Shapes} label="Elements" id="elements" />
                            <ToolBtn icon={Icons.Type} label="Text" id="text" />
                            <ToolBtn icon={Icons.Overlay} label="Overlays" id="overlays" />
                            <ToolBtn icon={Icons.Video} label="Animation" id="animations" />
                        </div>

                        <div style={{ width: `${drawerWidth}px` }} className={`bg-editor-panel flex flex-col z-10 overflow-hidden shrink-0 ${drawerWidth === 0 ? 'border-none' : 'border-r border-editor-border'}`}>
                            <div className="p-4 overflow-y-auto flex-1 custom-scrollbar space-y-6">
                                {activeTool === 'elements' && (
                                    <>
                                        <h3 className="text-sm font-bold mb-2 text-gray-300">Basic Shapes</h3>
                                        <div className="grid grid-cols-2 gap-2 mb-6">
                                            <button onClick={() => addShape('rect')} className="bg-editor-border hover:bg-accent/20 p-3 rounded flex flex-col items-center gap-1"><div className="w-6 h-4 border border-white"></div><span className="text-[10px]">Rect</span></button>
                                            <button onClick={() => addShape('circle')} className="bg-editor-border hover:bg-accent/20 p-3 rounded flex flex-col items-center gap-1"><div className="w-4 h-4 border border-white rounded-full"></div><span className="text-[10px]">Circle</span></button>
                                        </div>
                                        <h3 className="text-sm font-bold mb-2 text-gray-300">Graphics & Stickers</h3>
                                        <div className="grid grid-cols-2 gap-2">
                                            {elementsAssets.map(a => (
                                                <div key={a.id} className="bg-gray-800 rounded p-1 cursor-pointer hover:ring-1 hover:ring-accent" onClick={() => addImage(a.url)}>
                                                    <img src={a.url} className="w-full h-auto object-contain" referrerPolicy="no-referrer"/>
                                                </div>
                                            ))}
                                        </div>
                                    </>
                                )}
                                {activeTool === 'text' && (
                                    <div className="space-y-3">
                                        <h3 className="text-sm font-bold mb-2 text-gray-300">Add Text</h3>
                                        <button onClick={() => addText('heading')} className="w-full text-left bg-editor-border/50 hover:bg-editor-border p-3 rounded-lg"><h1 className="text-2xl font-bold">Heading</h1></button>
                                        <button onClick={() => addText('sub')} className="w-full text-left bg-editor-border/50 hover:bg-editor-border p-3 rounded-lg"><h2 className="text-lg font-semibold">Subheading</h2></button>
                                        <button onClick={() => addText('body')} className="w-full text-left bg-editor-border/50 hover:bg-editor-border p-3 rounded-lg"><p className="text-sm">Body text</p></button>
                                    </div>
                                )}
                                {activeTool === 'overlays' && (
                                    <>
                                        <h3 className="text-sm font-bold mb-2 text-gray-300">Library</h3>
                                        <div className="grid grid-cols-2 gap-2">
                                            {overlayAssets.map(a => (
                                                <div key={a.id} className="group relative aspect-square rounded overflow-hidden cursor-pointer bg-gray-800" onClick={() => addImage(a.url)}>
                                                    <img src={a.url} className="w-full h-full object-cover opacity-80 hover:opacity-100" referrerPolicy="no-referrer" />
                                                </div>
                                            ))}
                                        </div>
                                    </>
                                )}
                                {activeTool === 'animations' && (
                                    <>
                                        <h3 className="text-sm font-bold mb-2 text-gray-300">Video Backgrounds</h3>
                                        <div className="flex flex-col gap-4">
                                            {animationAssets.map(a => (
                                                <div key={a.id} className="group relative rounded-lg overflow-hidden bg-black border border-gray-700">
                                                    <video 
                                                        src={a.url} 
                                                        className="w-full h-auto object-cover opacity-80 group-hover:opacity-100 transition-opacity" 
                                                        autoPlay loop muted playsInline
                                                    ></video>
                                                    <div className="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 bg-black/40 transition-opacity">
                                                        <button 
                                                            onClick={() => forceDownload(a.url, a.title)} 
                                                            className="bg-accent hover:bg-accent-hover text-white p-2 rounded-full flex items-center gap-1 shadow-lg transform scale-90 group-hover:scale-100 transition-transform"
                                                        >
                                                            <Icons.Download />
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>

                        <div onMouseDown={startResizing} onTouchStart={startResizing} className="w-5 -ml-2.5 z-50 cursor-col-resize flex flex-col justify-center items-center group touch-none select-none h-full relative hover:bg-accent/10">
                            <div className="w-[2px] h-full bg-editor-border group-hover:bg-accent"></div>
                        </div>

                        <div className="flex-1 canvas-wrapper relative flex items-center justify-center overflow-auto p-4 md:p-12">
                            <div className="shadow-2xl border border-gray-700 bg-white">
                                <canvas id="editor-canvas"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- MAIN APP ---
        function App() {
            const [view, setView] = useState('home'); 
            const [selectedAsset, setSelectedAsset] = useState(null); 
            const [editingAsset, setEditingAsset] = useState(null); 
            const [search, setSearch] = useState('');
            const [category, setCategory] = useState('All');
            const [assets, setAssets] = useState([]);
            const [loading, setLoading] = useState(true);
            const [adSettings, setAdSettings] = useState(null);

            useEffect(() => {
                fetchAssets();
                fetchAdSettings();

                const channel = supabaseClient.channel('public:assets')
                    .on('postgres_changes', { event: '*', schema: 'public', table: 'assets' }, fetchAssets)
                    .subscribe();
                return () => supabaseClient.removeChannel(channel);
            }, []);

            async function fetchAssets() {
                const { data, error } = await supabaseClient.from('assets').select('*').order('created_at', { ascending: false });
                if (!error) { setAssets(data); setLoading(false); }
            }

            async function fetchAdSettings() {
                const { data } = await supabaseClient.from('app_settings').select('*').eq('id', 1).single();
                // Map 'ad_link_url' from Admin Panel to 'linkUrl' in User App
                if (data) setAdSettings({ linkUrl: data.ad_link_url });
            }
            
            async function handleLike(asset) {
                if(!asset) return;
                const newCount = (asset.likes || 0) + 1;
                setAssets(prev => prev.map(a => a.id === asset.id ? { ...a, likes: newCount } : a));
                await supabaseClient.from('assets').update({ likes: newCount }).eq('id', asset.id);
            }

            const homeCategories = ['All', 'Thumbnail', 'Animation', 'Background', 'Sticker', 'Icon', 'Emoji'];
            
            const filteredAssets = assets.filter(a => {
                const matchesSearch = a.title.toLowerCase().includes(search.toLowerCase());
                const matchesCat = category === 'All' ? true : a.type.toLowerCase() === category.toLowerCase();
                return matchesSearch && matchesCat;
            });

            return (
                <>
                    {view === 'home' && (
                        <div className="min-h-screen pb-20">
                            <nav className="sticky top-0 z-30 bg-card/80 backdrop-blur border-b border-gray-700 px-6 h-16 flex items-center justify-between">
                                <div className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                                    <div className="w-8 h-8 bg-accent rounded-lg flex items-center justify-center">A</div>
                                    AssetMaster
                                </div>
                                <div className="hidden md:flex gap-6 text-sm font-medium text-gray-300">
                                    <a href="#" className="hover:text-white">Assets</a>
                                </div>
                            </nav>

                            <div className="py-20 px-6 text-center max-w-4xl mx-auto">
                                <h1 className="text-4xl md:text-6xl font-bold mb-6 bg-gradient-to-r from-white to-gray-500 bg-clip-text text-transparent">
                                    Free Assets for Modern Creators
                                </h1>
                                <div className="relative max-w-xl mx-auto">
                                    <input type="text" placeholder="Search assets..." className="w-full h-14 pl-12 pr-4 rounded-full bg-card border border-gray-600 focus:ring-1 focus:ring-accent outline-none text-white shadow-lg" value={search} onChange={(e) => setSearch(e.target.value)} />
                                    <div className="absolute left-4 top-4 text-gray-400"><Icons.Search /></div>
                                </div>
                            </div>

                            <div className="px-6 mb-8 overflow-x-auto no-scrollbar">
                                <div className="flex justify-center gap-2 min-w-max">
                                    {homeCategories.map(cat => (
                                        <button key={cat} onClick={() => setCategory(cat)} className={`px-5 py-2 rounded-full text-sm font-medium transition-all ${category === cat ? 'bg-accent text-white' : 'bg-card text-gray-400 hover:text-white hover:bg-gray-700'}`}>{cat}</button>
                                    ))}
                                </div>
                            </div>

                            <div className="container mx-auto px-6">
                                {loading ? (
                                    <div className="flex justify-center items-center py-20"><Icons.Spinner /></div>
                                ) : (
                                    <div className="masonry-grid">
                                        {filteredAssets.map(asset => (
                                            <AssetCard key={asset.id} asset={asset} onClick={setSelectedAsset} onLike={handleLike} />
                                        ))}
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    <AssetModal 
                        asset={selectedAsset} 
                        onClose={() => setSelectedAsset(null)} 
                        onEdit={(asset) => { setSelectedAsset(null); setEditingAsset(asset); setView('editor'); }} 
                        adSettings={adSettings}
                    />
                    
                    {view === 'editor' && editingAsset && (
                        <ProEditor asset={editingAsset} onClose={() => { setEditingAsset(null); setView('home'); }} allAssets={assets} />
                    )}
                </>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
